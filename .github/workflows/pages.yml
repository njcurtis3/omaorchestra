name: pages

# The website: site/build.py renders the README and docs/ into _site/, and
# GitHub Pages serves it. Rebuilt when the docs change and when a release is
# published or edited, so the Releases and Install pages always show the
# latest. Pull requests build it without deploying, to catch a broken page.
#
# Only main may deploy to github-pages, and a release event runs from its
# tag, so a release only starts a run on main (which also keeps an edited
# old release from deploying that release's docs).

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - site/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - README.md
      - docs/**
      - site/**
      - .github/workflows/pages.yml
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  # Never cancel a deploy halfway; superseded pull request builds can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rebuild from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Install dependencies
        run: pip install -r site/requirements.txt
      - name: Build
        env:
          # Release notes and downloads come from the API; the token lifts
          # the anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python site/build.py
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.event_name != 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
