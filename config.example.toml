# Copy to ~/.config/omaorchestra/config.toml. Every setting is optional;
# the values below are the defaults. Check your file with
# `omaorchestra config check`.

[daemon]
# Seconds between checks for sessions whose agent process has died
prune_interval = 30
# Log every request, not just session changes (same as `daemon --verbose`)
verbose = false

[agents]
# Agents whose hook events are tracked
enabled = ["claude", "codex", "opencode"]

[notifications]
# Notify when an agent starts waiting for you (closed again once it stops)
waiting = true
# Notify when an agent finishes after working at least this many seconds;
# 0 turns it off
finished_after = 120

[tasks]
# Queued tasks start while fewer agents than this are busy (working or
# waiting for you); idle agents do not count
max_parallel = 2
# In a git repository, give each task its own worktree and branch so parallel
# agents do not collide (`run --no-worktree` or the New task form can opt out)
isolate_with_worktrees = true
# Start no queued task while any of the agent's subscription rate limits
# (as Omarchy's usage records report them) is at or above this percentage;
# 0 turns it off
pause_at_usage = 90
# Start no queued task that runs through an API provider once today's
# estimated provider spend reaches this many US dollars; 0 turns it off
daily_budget = 0
# The most tasks one chain may have (`queue add --after`, recipes)
max_chain_steps = 5
# When an agent's usage limit holds a queued task, start it on this agent
# instead (claude, codex or opencode; empty waits); also offered as a
# hand-off when a running agent reaches its limit
fallback_agent = ""

[remote]
# Push notifications to your phone through ntfy (https://ntfy.sh). Store a
# topic first: `omaorchestra remote topic --new`, then subscribe to it in the
# ntfy app; `omaorchestra remote test` sends one
push = false
# ntfy.sh, or your own ntfy server
server = "https://ntfy.sh"
# What a notification says: "minimal" (the project and what happened),
# "summary" (adds the task title) or "full" (adds the agent's question, which
# can quote commands and code). Prompts and code leave the machine only with full
content = "minimal"
# Which events push: needs-you, finished (after notifications.finished_after),
# failed (a task did not start), usage-limit (a busy agent hit its limit),
# queue-blocked (the queue is held back by a limit or the budget)
events = ["needs-you", "finished", "failed", "usage-limit", "queue-blocked"]
# Pushes go out only while you are away. With `omaorchestra away auto` (the
# default) that is once the screen is locked, or after this many minutes
# without input; `away on` and `away off` set it by hand
away_after = 10
# While you are away, Claude Code's permission prompts can also be answered
# from `omaorchestra top` or `omaorchestra approve <id>` / `deny <id>`, one
# request at a time (never a standing rule). The terminal prompt stays up
answer_prompts = true
# How long (seconds) a prompt stays answerable remotely
answer_wait = 600

[history]
# A record of each ended session: `omaorchestra history`. Records older than
# this many days are deleted; 0 keeps them all
keep_days = 90
# false: keep no task titles or prompts in the records (and remove any kept)
titles = true
