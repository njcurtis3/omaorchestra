# Copy to ~/.config/omaorchestra/config.toml. Every setting is optional;
# the values below are the defaults. Check your file with
# `omaorchestra config check`.

[daemon]
# Seconds between checks for sessions whose agent process has died
prune_interval = 30
# Log every request, not just session changes (same as `daemon --verbose`)
verbose = false

[agents]
# Agents whose hook events are tracked
enabled = ["claude"]

[tasks]
# Not used yet: these take effect with the task queue.
# Maximum agents running at once
max_parallel = 2
# Give every task its own git worktree so parallel agents do not collide
isolate_with_worktrees = true
