# Copy to ~/.config/omaorchestra/config.toml. Every setting is optional;
# the values below are the defaults. Check your file with
# `omaorchestra config check`.

[daemon]
# Seconds between checks for sessions whose agent process has died
prune_interval = 30
# Log every request, not just session changes (same as `daemon --verbose`)
verbose = false

[agents]
# Agents whose hook events are tracked
enabled = ["claude"]

[notifications]
# Notify when an agent starts waiting for you (closed again once it stops)
waiting = true
# Notify when an agent finishes after working at least this many seconds;
# 0 turns it off
finished_after = 120

[tasks]
# Maximum agents running at once (not used yet: takes effect with the task queue)
max_parallel = 2
# In a git repository, give each task its own worktree and branch so parallel
# agents do not collide (`run --no-worktree` or the New task form can opt out)
isolate_with_worktrees = true
